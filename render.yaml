services:
  - type: web
    name: ai-safety-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --source synthetic --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: CAMERA_SOURCE
        value: synthetic
      - key: DETECT_WEAPON_CLASSES
        value: grenade,knife,pistol,rifle
      - key: CORS_ORIGINS
        value: '*'
      - key: PYTHON_VERSION
        value: '3.11.0'